# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Every branch is built and tested. main and the release/x.y.z branches deploy their -SNAPSHOT versions to
# GitHub Packages, and a tag x.y.z on main publishes the release x.y.z; .github/scripts/check-versions.sh
# says which version may be deployed from where.

name: Java CI with Maven and Docker

on:
  push:
    branches:
    - '**'
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Two pushes to one branch must not deploy at the same time, and a deployment is never cancelled halfway.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    # .github/maven-settings.xml hands the token to Maven.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    container:
      # Use pre-built Docker image from https://github.com/advantest/fluentmark/blob/develop/.github/workflows/build-docker-img-for-plantuml.yml
      # The image provides Graphviz, Pandoc, JDK, Maven in the required versions
      image: ghcr.io/advantest/fluentmark:graphviz-11.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Check out
      uses: actions/checkout@v6
      with:
        # The check compares the version with those of the other branches and looks for the commit on main.
        fetch-depth: 0
        filter: blob:none

    - name: Check the version
      id: check
      run: MAVEN_ARGS="-s .github/maven-settings.xml" bash .github/scripts/check-versions.sh

    - name: Build with Maven
      run: mvn -B clean verify -U -s .github/maven-settings.xml

    - name: Keep the code coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: target/site/jacoco
        if-no-files-found: warn

    - name: Deploy to GitHub Maven Packages
      if: steps.check.outputs.deploy == 'true' && github.event_name != 'pull_request' && github.repository == 'advantest/markdown-core'
      run: mvn -B -Pdeploy-github -DskipTests deploy -s .github/maven-settings.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    #- name: Update dependency graph
    #  uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

